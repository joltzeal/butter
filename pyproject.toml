[project]
name = "butter"
version = "0.1.23"
description = "Butter — Apple ID / Store billing console (Tauri + Python backend)"
readme = "README.md"
authors = [
    { name = "ameno", email = "bravesfly@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "curl-cffi>=0.9",
    "cryptography>=43",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
butter = "butter.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/butter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 125
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
