name: release

# PyInstaller cannot cross-compile and NSIS is Windows-only, so each installer is
# built on its own runner. Tag pushes publish a draft release; branch/PR runs
# only build and upload workflow artifacts.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          # Editable install puts src/butter on the path; without it pytest
          # cannot import the package (locally uv does this implicitly).
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # `tauri build` is the first place a broken build would otherwise show up,
      # and it costs a full toolchain by then.
      - name: Typecheck and bundle the frontend
        working-directory: desktop
        run: pnpm build

  build:
    name: build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      ACTIVATION_URL: ${{ vars.BUTTER_ACTIVATION_URL }}
      # Signs updater artifacts. Without it the build still works, but the
      # produced bundles cannot be installed as updates.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Read-only PAT for the private release assets (updater endpoint).
      VITE_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      VITE_ACTIVATION_URL: ${{ vars.BUTTER_ACTIVATION_URL }}
      BUTTER_ACTIVATION_URL: ${{ vars.BUTTER_ACTIVATION_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            args: --bundles nsis
          - label: macos
            os: macos-latest
            # arm64 only: the sidecar is compiled by the runner's own clang, so a
            # universal app would carry an arm64-only backend and break on Intel.
            args: --target aarch64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import json;print(json.load(open("desktop/package.json"))["version"])')" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with package.json ships a build that reports the
      # wrong version, which silently breaks the updater's comparison.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match package.json version $want"
            exit 1
          fi

      - name: Check activation endpoint
        shell: bash
        run: |
          if [ -z "$ACTIVATION_URL" ]; then
            echo "::warning::vars.BUTTER_ACTIVATION_URL is empty — the build cannot activate"
          fi

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.10"

      # `shell` does not accept an expression here, so the two platforms get
      # their own literal step.
      - name: Build backend sidecar (windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./scripts/build_sidecar.ps1

      - name: Build backend sidecar (macos)
        if: matrix.label != 'windows'
        run: ./scripts/build_sidecar.sh

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing is wired but commented out: an empty APPLE_CERTIFICATE
          # is still "present" to the bundler, which then fails importing an
          # empty PKCS#12. Uncomment once the six secrets below exist.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          # Empty tagName on non-tag runs means "build only".
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Butter ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: butter-${{ matrix.label }}-${{ steps.ver.outputs.version }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 30

  # `releases/latest/download` answers 404 on a private repository, and the
  # asset URLs tauri-action writes point at exactly that path. Rewrite them to
  # the API asset endpoints and publish the manifest on a `latest` branch, which
  # raw.githubusercontent serves to the app's token.
  manifest:
    name: publish updater manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # `gh release download` shells out to git and dies without a repo.
      - uses: actions/checkout@v4

      - name: Fetch the generated manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" -p latest.json -O latest.json --clobber

      - name: Rewrite asset URLs to API endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' > rewritten.json
          import json, os, subprocess
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          release = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/releases/tags/{tag}"]))
          by_name = {a["name"]: a["id"] for a in release["assets"]}
          manifest = json.load(open("latest.json"))
          for entry in manifest["platforms"].values():
              name = entry["url"].rsplit("/", 1)[-1]
              entry["url"] = f"https://api.github.com/repos/{repo}/releases/assets/{by_name[name]}"
          json.dump(manifest, open("rewritten.json", "w"), indent=2)
          PY
          mv rewritten.json latest.json

      - name: Publish to the latest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # First run has no branch yet; create it off the tag, ignore "exists".
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref=refs/heads/latest -f sha="$SHA" >/dev/null 2>&1 || true
          # Updating a file needs the blob sha; the first run has none.
          sha="$(gh api "repos/${{ github.repository }}/contents/latest.json?ref=latest" -q .sha 2>/dev/null || true)"
          content="$(base64 -w0 latest.json)"
          gh api -X PUT "repos/${{ github.repository }}/contents/latest.json" \
            -f message="manifest for ${{ github.ref_name }}" \
            -f branch=latest -f content="$content" ${sha:+-f sha="$sha"} >/dev/null
