name: build

# PyInstaller cannot cross-compile and NSIS is Windows-only, so the installer is
# built on a Windows runner rather than on the developer's Mac.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install puts src/butter on the path; without it pytest
          # cannot import the package (locally uv does this implicitly).
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  windows:
    name: build (windows installer)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install python deps
        run: |
          pip install --upgrade pip
          pip install -e . "pyinstaller>=6.10"

      - name: Build backend sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name butter-backend `
            --paths src --collect-all curl_cffi --collect-submodules uvicorn `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --distpath backend-dist --workpath build --specpath build `
            src/butter/__main__.py
        shell: pwsh

      - name: Point resources at the .exe
        shell: pwsh
        run: |
          $p = "desktop/src-tauri/tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.bundle.resources = [pscustomobject]@{
            "../../backend-dist/butter-backend.exe" = "backend/butter-backend.exe"
          }
          $c | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*.exe" out/
          Copy-Item "desktop/src-tauri/target/release/butter.exe" out/ -ErrorAction SilentlyContinue
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: butter-windows-${{ steps.ver.outputs.version }}
          path: out/*
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  macos:
    name: build (macos app)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import json;print(json.load(open(\"desktop/package.json\"))[\"version\"])')" >> $GITHUB_OUTPUT

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.10"

      - name: Build backend sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name butter-backend \
            --paths src --collect-all curl_cffi --collect-submodules uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --distpath backend-dist --workpath build --specpath build \
            src/butter/__main__.py

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: desktop
        run: pnpm tauri build --bundles app,dmg

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -R "desktop/src-tauri/target/release/bundle/macos/Butter.app" out/
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: butter-macos-${{ steps.ver.outputs.version }}
          path: out/*
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
